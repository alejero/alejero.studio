# alejero.studio Cloudflare Worker
# Serves the portfolio homepage static assets for:
#   alejero.studio
#   www.alejero.studio
#
# The invitations product (invitations.alejero.studio, invites-demo.alejero.studio,
# and {slug}.alejero.studio) is managed by the separate invitations-alejero-studio Worker.

name = "alejerostudio"
compatibility_date = "2026-06-29"
main = "src/index.js"
workers_dev = true

routes = [
  { pattern = "alejero.studio/*",     zone_name = "alejero.studio" },
  { pattern = "www.alejero.studio/*", zone_name = "alejero.studio" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
